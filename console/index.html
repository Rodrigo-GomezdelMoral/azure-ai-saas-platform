<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tenant console</title>
    <style>
      :root { --ink: #1b1f24; --muted: #5c6670; --line: #d9dee3; --paper: #ffffff; --accent: #0b5fff; --ok: #1a7f37; --bad: #b42318; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--ink); background: #f4f6f8; }
      header { display: flex; align-items: baseline; gap: 16px; padding: 20px 24px; background: var(--paper); border-bottom: 1px solid var(--line); }
      header h1 { margin: 0; font-size: 18px; }
      header .spacer { flex: 1; }
      main { max-width: 1040px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 24px; }
      section { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
      h2 { margin: 0 0 12px; font-size: 16px; }
      form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; align-items: end; }
      label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
      input, select, button, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
      button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
      button.quiet { background: var(--paper); color: var(--ink); }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; }
      ol { margin: 0; padding-left: 22px; }
      li.pending { color: var(--muted); }
      li.done { color: var(--ok); }
      li.failed { color: var(--bad); }
      #message { color: var(--muted); min-height: 1.5em; }
      #elapsed { font-variant-numeric: tabular-nums; color: var(--muted); }
      textarea { width: 100%; height: 96px; font-family: ui-monospace, monospace; font-size: 12px; }
      @media (max-width: 720px) { form { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Regulatory Intelligence as a Service · tenant console</h1>
      <span class="spacer"></span>
      <span id="who"></span>
      <button id="signin" class="quiet" type="button">Sign in</button>
    </header>
    <main>
      <section>
        <h2>Onboard a customer</h2>
        <form id="onboard">
          <label>Company name <input name="name" required minlength="2" maxlength="80" placeholder="Globex Industries" /></label>
          <label>Plan
            <select name="plan">
              <option value="starter">Starter · shared</option>
              <option value="business">Business · dedicated namespace and index</option>
              <option value="enterprise">Enterprise · dedicated pool and database</option>
            </select>
          </label>
          <label>PII policy
            <select name="pii">
              <option value="none">none</option>
              <option value="before_upstream">before upstream</option>
              <option value="before_storage">before storage</option>
            </select>
          </label>
          <button type="submit">Onboard</button>
        </form>
        <p id="message"></p>
        <div id="progress" hidden>
          <ol id="steps"></ol>
          <p>Elapsed <span id="elapsed">0.0 s</span></p>
        </div>
        <div id="credential" hidden>
          <label>API credential, shown once <textarea id="secret" readonly></textarea></label>
          <button id="copy" class="quiet" type="button">Copy</button>
        </div>
      </section>
      <section>
        <h2>Tenants <small id="count"></small></h2>
        <table>
          <thead>
            <tr><th>Id</th><th>Name</th><th>Plan</th><th>PII</th><th>Namespace · billing store</th><th>Status</th></tr>
          </thead>
          <tbody id="tenants"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
