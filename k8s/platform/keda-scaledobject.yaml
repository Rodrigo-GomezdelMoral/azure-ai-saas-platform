apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: servicebus-workload-identity
spec:
  podIdentity:
    provider: azure-workload
    identityId: 00000000-0000-0000-0000-000000000000
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: onboarding
spec:
  scaleTargetRef: { name: onboarding }
  minReplicaCount: 0
  maxReplicaCount: 2
  pollingInterval: 15
  cooldownPeriod: 120
  triggers:
    - type: azure-servicebus
      metadata: { queueName: onboarding, namespace: sb-aisaas-prod-swc, messageCount: "1" }
      authenticationRef: { name: servicebus-workload-identity }
