apiVersion: v1
kind: ServiceAccount
metadata:
  name: onboarding
  annotations:
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-onboarding
rules:
  - apiGroups: [""]
    resources: [namespaces, serviceaccounts, services, resourcequotas, limitranges, configmaps]
    verbs: [get, list, create, patch, update]
  - apiGroups: [apps, autoscaling, networking.k8s.io, gateway.networking.k8s.io, scheduling.k8s.io]
    resources: [deployments, horizontalpodautoscalers, networkpolicies, httproutes, priorityclasses]
    verbs: [get, list, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-onboarding
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tenant-onboarding }
subjects:
  - { kind: ServiceAccount, name: onboarding, namespace: platform }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding
  labels: { app: onboarding }
spec:
  replicas: 0
  selector:
    matchLabels: { app: onboarding }
  template:
    metadata:
      labels: { app: onboarding, azure.workload.identity/use: "true" }
    spec:
      serviceAccountName: onboarding
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: onboarding
          image: gateway:0.0.0
          args: [python, -m, ops.onboard, --worker]
          envFrom: [{ configMapRef: { name: gateway-settings } }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { exec: { command: [sh, -c, "test -n \"$(find /tmp/alive -mmin -2)\""] }, periodSeconds: 30 }
          livenessProbe: { exec: { command: [sh, -c, "test -n \"$(find /tmp/alive -mmin -5)\""] }, periodSeconds: 60, failureThreshold: 3 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
