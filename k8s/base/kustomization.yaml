apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - priorityclass.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - networkpolicy.yaml
  - hpa.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: gateway-settings
    envs: [../settings.env]
