apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tenants-starter
resources:
  - ../../base
labels:
  - pairs: { saas.tier: starter }
    includeSelectors: false
patches:
  - target: { kind: HTTPRoute, name: gateway }
    patch: |-
      - { op: add, path: /spec/rules/0/matches/-, value: { path: { type: PathPrefix, value: /admin } } }
