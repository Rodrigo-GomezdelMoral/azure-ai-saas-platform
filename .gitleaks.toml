title = "azure-ai-saas-platform"

[extend]
useDefault = true

[[rules]]
id = "email-address"
description = "An email address; the repository commits none"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
[rules.allowlist]
regexes = ['''@example\.(com|invalid)''', '''users\.noreply\.github\.com''']

[[rules]]
id = "guid"
description = "A GUID; only the all-zero placeholder and the built-in role definition ids the templates need are allowed"
regex = '''[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'''
[rules.allowlist]
regexes = [
  '''00000000-0000-0000-0000-00000000000[0-9]''',
  '''e40ec5ca-96e0-45a2-b4ff-59039f2c2b59''',
  '''72fafb9e-0641-4937-9268-a91bfd8191a3''',
  '''12338af0-0e69-4776-bea7-57ae8d297424''',
  '''3913510d-42f4-4e42-8a64-420c390055eb''',
  '''8311e382-0749-4cb8-b61a-304f252e45ec''',
  '''7f951dda-4ed3-4680-a7ca-43fe172d538d''',
  '''a97b65f3-24c7-4388-baec-2e87135dc908''',
  '''5e0bd9bd-7b93-4f28-af87-19fc36ad61bd''',
  '''7ca78c08-252a-4471-8644-bb5ff32d4ba0''',
  '''8ebe5a00-799e-43f5-93ac-243d3dce84a7''',
]
